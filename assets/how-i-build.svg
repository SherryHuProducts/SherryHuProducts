<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">How Sherry turns finance needs into controlled systems</title>
  <desc id="desc">Finance need, map workflow, define rules and controls, build and integrate, verify and reconcile, then explain and improve.</desc>
  <defs>
    <linearGradient id="thinking-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .step { fill: #172033; font-size: 14px; font-weight: 700; }
      .num { fill: #FFFFFF; font-size: 12px; font-weight: 750; }
    </style>
  </defs>
  <rect width="1200" height="250" rx="24" fill="url(#thinking-bg)" stroke="#D7DDEA"/>
  <text x="54" y="54" fill="#111827" font-size="23" font-weight="750">Accounting context → explicit controls → clearer decisions</text>
  <text x="54" y="80" fill="#64748B" font-size="14">A practical loop for turning finance judgment into testable system behavior</text>

  <line x1="98" y1="151" x2="1102" y2="151" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>

  <g>
    <circle cx="98" cy="151" r="23" fill="#0F766E"/><text x="98" y="155" text-anchor="middle" class="num">01</text>
    <text x="98" y="201" text-anchor="middle" class="step">Finance Need</text>
  </g>
  <g>
    <circle cx="299" cy="151" r="23" fill="#0E7490"/><text x="299" y="155" text-anchor="middle" class="num">02</text>
    <text x="299" y="201" text-anchor="middle" class="step">Map Workflow</text>
  </g>
  <g>
    <circle cx="500" cy="151" r="23" fill="#2563EB"/><text x="500" y="155" text-anchor="middle" class="num">03</text>
    <text x="500" y="201" text-anchor="middle" class="step">Rules &amp; Controls</text>
  </g>
  <g>
    <circle cx="701" cy="151" r="23" fill="#4F46E5"/><text x="701" y="155" text-anchor="middle" class="num">04</text>
    <text x="701" y="201" text-anchor="middle" class="step">Build &amp; Integrate</text>
  </g>
  <g>
    <circle cx="902" cy="151" r="23" fill="#7C3AED"/><text x="902" y="155" text-anchor="middle" class="num">05</text>
    <text x="902" y="201" text-anchor="middle" class="step">Verify &amp; Reconcile</text>
  </g>
  <g>
    <circle cx="1102" cy="151" r="23" fill="#C2410C"/><text x="1102" y="155" text-anchor="middle" class="num">06</text>
    <text x="1102" y="201" text-anchor="middle" class="step">Explain &amp; Improve</text>
  </g>
</svg>
